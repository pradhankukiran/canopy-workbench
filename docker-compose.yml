name: canopy-workbench

services:
  postgres:
    image: postgres:16-alpine
    container_name: canopy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-canopy}
      POSTGRES_USER: ${POSTGRES_USER:-canopy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-canopy_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-canopy} -d ${POSTGRES_DB:-canopy}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - canopy

  redis:
    image: redis:7-alpine
    container_name: canopy-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - canopy

  minio:
    image: minio/minio:latest
    container_name: canopy-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - canopy

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  canopy:
    driver: bridge
